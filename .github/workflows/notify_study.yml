name: 🔔 Notification study - test & build

# Fork workflow: tests the notification study feature (unit + real emulator),
# then builds an installable APK and publishes it as a GitHub release.

on:
  workflow_dispatch:
  push:
    branches:
      - notify-study

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (notification study)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "jetbrains"
          java-version: "21"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Gradle Dependency Download
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          retry_wait_seconds: 60
          max_attempts: 3
          command: ./gradlew robolectricSdkDownload --daemon

      - name: Notification study unit tests
        shell: bash
        run: |
          mkdir -p ci-out
          ./gradlew :AnkiDroid:testPlayDebugUnitTest --tests 'com.ichi2.anki.notifystudy.*' --daemon 2>&1 | tee ci-out/unit.log
          exit ${PIPESTATUS[0]}

      - name: Lint & format check
        shell: bash
        run: |
          ./gradlew :AnkiDroid:lintPlayRelease ktlintCheck --daemon 2>&1 | tee ci-out/lint.log
          exit ${PIPESTATUS[0]}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-reports
          path: |
            AnkiDroid/build/reports/tests/
            AnkiDroid/build/reports/lint-results*.html
          if-no-files-found: ignore

      - name: Publish logs (readable through git)
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ci-out
          cp -r AnkiDroid/build/test-results/testPlayDebugUnitTest ci-out/test-results 2>/dev/null || true
          cp AnkiDroid/build/reports/lint-results*.xml ci-out/ 2>/dev/null || true
          cd ci-out
          git init -q
          git checkout -q -b logs
          git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -q --allow-empty -m "unit logs for run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs/unit

  device:
    name: Emulator test (real notifications)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: insightsengineering/disk-space-reclaimer@dae9fabcb8febe09f6585471948acf9dc9a57489 # v1.1.2
        with:
          tools-cache: false
          android: false
          dotnet: true
          haskell: false
          large-packages: false
          swap-storage: false
          docker-images: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Configure JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "jetbrains"
          java-version: "21"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Build test APKs
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 30
          retry_wait_seconds: 60
          max_attempts: 3
          command: ./gradlew :AnkiDroid:packagePlayDebug :AnkiDroid:packagePlayDebugAndroidTest --daemon

      - name: Run notification study on the emulator
        timeout-minutes: 45
        env:
          API_LEVEL: "35"
        run: bash .github/notify-study/emulator-test.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emulator-screenshots
          path: ci-out/screenshots/
          if-no-files-found: ignore

      - name: Upload emulator test report and logcat
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emulator-test-report
          path: |
            AnkiDroid/build/reports/androidTests/
            AnkiDroid/build/outputs/androidTest-results/
          if-no-files-found: ignore

      - name: Publish logs (readable through git)
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ci-out
          true
          cd ci-out
          git init -q
          git checkout -q -b logs
          git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -q --allow-empty -m "device logs for run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs/device

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "jetbrains"
          java-version: "21"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Build release APK
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 40
          retry_wait_seconds: 60
          max_attempts: 2
          command: mkdir -p ci-out && ./gradlew :AnkiDroid:assembleFullRelease -Duniversal-apk=true --daemon > ci-out/apk.log 2>&1 || (tail -200 ci-out/apk.log; exit 1)

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(ls AnkiDroid/build/outputs/apk/full/release/*universal*.apk | head -1)
          cp "$APK" dist/AnkiDroid-notifystudy.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/aapt2 dump badging dist/AnkiDroid-notifystudy.apk | head -3 | tee dist/badging.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AnkiDroid-notifystudy-apk
          path: dist/

      - name: Publish logs (readable through git)
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ci-out
          cp dist/badging.txt ci-out/ 2>/dev/null || true
          cd ci-out
          git init -q
          git checkout -q -b logs
          git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -q --allow-empty -m "apk logs for run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs/apk

  release:
    name: Publish release
    needs: [unit, device, apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: AnkiDroid-notifystudy-apk
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="notifystudy-${{ github.run_number }}"
          gh release create "$TAG" dist/AnkiDroid-notifystudy.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "AnkiDroid 알림학습 #${{ github.run_number }}" \
            --notes "알림 학습 기능이 추가된 AnkiDroid입니다. 공식 AnkiDroid와 함께 설치할 수 있습니다. 단위 테스트와 에뮬레이터 테스트를 통과한 빌드입니다. $(cat dist/badging.txt | head -1)"
